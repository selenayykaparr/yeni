<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Molly.co - Çocuk Masalları</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#fffae6">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>

<body>

<!-- MOLLY.CO AÇILIŞ EKRANI -->
<div id="splash-screen" class="splash-screen">
  <img
    src="https://raw.githubusercontent.com/selenayykaparr/aciliskapak/0f91591e2fc64272bc5335e20b8f3c2eccf983ae/ChatGPT%20Image%2010%20Eyl%202026%2012_39_04.png"
    alt="Molly.co Sesli Masallar"
    class="splash-image"
  >
</div>


<audio
  id="bark-element"
  src="https://raw.githubusercontent.com/selenayykaparr/hav/b331879ce7c61fdb809baed252ce320a7b698779/hav.mp3"
  preload="auto">
</audio>


<div class="phone-container">

  <div class="balloon-container">
    <div class="balloon balloon-blue">🎈</div>
    <div class="balloon balloon-pink">🎈</div>
    <div class="balloon balloon-green">🎈</div>
    <div class="balloon balloon-purple">🎈</div>
    <div class="balloon balloon-red">🎈</div>
  </div>


  <div class="app-header">

    <div class="floating-scene">

      <div class="flying-dog-wrapper">
        <img
          src="https://raw.githubusercontent.com/selenayykaparr/molly.com/main/3052a118-9c85-4c33-82bd-84a2e47d8b18-removebg-preview.png"
          alt="Molly.co Canlı Logo"
          class="actual-logo-img"
          id="dog-logo">
      </div>

      <div class="register-hint" id="register-trigger-btn">
        🔑 <span>Üye Ol</span>
      </div>

    </div>


    <h1 class="brand-title">molly.co</h1>

    <p class="sub-title" id="sub-title-text">
      Hangi macerayı dinlemek istersin? 🐾
    </p>

  </div>


  <div class="book-list"></div>


  <div id="audio-player" class="player-panel hidden">

    <button id="back-to-menu" class="close-player-btn">
      Kapat ✖
    </button>


    <div class="player-cover-container">
      <img
        id="playing-cover"
        src=""
        alt="Masal Kapak Görseli">
    </div>


    <h4 id="playing-title">
      Şimdi Dinleniyor...
    </h4>

    <p id="playing-desc">
      Kitap açıklaması
    </p>


    <audio
      id="main-audio"
      preload="auto">
    </audio>


    <div class="custom-audio-bar">

      <button
        id="custom-prev-btn"
        class="custom-ctrl-btn"
        title="Önceki Masal">
        ⏮
      </button>


      <button
        id="custom-play-btn"
        class="custom-play-btn"
        title="Oynat / Durdur">
        ▶
      </button>


      <button
        id="custom-next-btn"
        class="custom-ctrl-btn"
        title="Sonraki Masal">
        ⏭
      </button>


      <div
        class="custom-progress-container"
        id="progress-container">

        <div
          class="custom-progress-bar"
          id="progress-bar">
        </div>

      </div>


      <span
        id="time-display"
        class="time-display">
        0:00
      </span>


      <button
        id="favorite-btn"
        class="fav-audio-btn"
        title="Favorilere Ekle">
        🤍
      </button>

    </div>

  </div>

</div>



<div
  id="register-modal"
  class="modal-overlay hidden">

  <div class="modal-content">

    <h3>
      Molly.co'ya Üye Ol
    </h3>


    <form id="register-form">

      <input
        type="text"
        id="reg-fullname"
        placeholder="Ad Soyad"
        required>


      <input
        type="text"
        id="reg-childname"
        placeholder="Çocuğunuzun Adı"
        required>


      <input
        type="email"
        id="reg-email"
        placeholder="Mail Adresi"
        required>


      <input
        type="tel"
        id="reg-phone"
        placeholder="Telefon Numarası"
        required>


      <button
        type="submit"
        class="reg-submit-btn">
        Üye Ol
      </button>

    </form>


    <button
      id="close-modal-btn"
      class="close-btn">
      Kapat
    </button>

  </div>

</div>


<script src="./script.js"></script>


<!-- MOLLY.CO SERVICE WORKER -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("/service-worker.js")
        .then(() => {
          console.log("Molly.co çevrimdışı desteği hazır 🐶");
        })
        .catch((error) => {
          console.error("Service Worker hatası:", error);
        });
    });
  }
</script>

</body>
</html>
